# 調査用：wrangler tail で、いまどの版が答えているかを確かめる。
# server/.probe を変えて push すると動く。結果は deploy-status ブランチの probe.md。
name: 集計サーバーの調査

on:
  push:
    branches: [main]
    paths: ['server/.probe']

permissions:
  contents: write

concurrency:
  group: server-deploy
  cancel-in-progress: false

jobs:
  probe:
    if: github.repository == 'shugodensetsu/shugodensetsu.github.io'
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      WRANGLER_SEND_METRICS: 'false'
    defaults:
      run:
        shell: bash
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 調べる
        run: |
          mask() { sed -E -e 's/[0-9a-f]{32}/<id>/g' -e 's/[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}/<email>/g'; }
          out="$RUNNER_TEMP/probe.md"
          hdr() { curl -s -o /dev/null -D - --max-time 15 "$1" | grep -iE '^(HTTP|content-type|www-authenticate)' || echo "(no response)"; }
          {
            echo "# 調査 $(TZ=Asia/Tokyo date '+%Y-%m-%d %H:%M:%S')"
            npm install --no-audit --no-fund > /dev/null 2>&1
            node tools/ensure-d1.mjs 2>&1 | mask
            echo '## tail（どの版が答えているか）'; echo '```'
            npx wrangler tail sakego --format json > "$RUNNER_TEMP/tail.json" 2> "$RUNNER_TEMP/tail.err" &
            tp=$!
            sleep 12
            for p in /manifest.webmanifest / /icon-192.png; do curl -s -o /dev/null -w "$p %{http_code}\n" --max-time 15 "https://sakego.shugodensetsu.workers.dev$p"; done
            sleep 8
            kill $tp 2>/dev/null || true
            node -e '
              const lines = require("fs").readFileSync(process.argv[1], "utf8").split("\n");
              let buf = "", n = 0;
              for (const l of lines) { buf += l + "\n"; try { const e = JSON.parse(buf); buf = ""; n++;
                console.log((e.scriptVersion && e.scriptVersion.id) || "?", e.outcome, e.event && e.event.request && new URL(e.event.request.url).pathname, e.event && e.event.response && e.event.response.status); } catch (_) {} }
              console.log("events:", n);
            ' "$RUNNER_TEMP/tail.json"
            tail -n 5 "$RUNNER_TEMP/tail.err" | mask
            echo '```'
            echo '## sakego versions'; echo '```'
            npx wrangler versions list --name sakego 2>&1 | mask | tail -n 14
            npx wrangler deployments status --name sakego 2>&1 | mask | tail -n 8
            echo '```'
          } > "$out" 2>&1 || true
          cat "$out"
          cd "$RUNNER_TEMP" && rm -rf st && git clone -q --depth 1 --branch deploy-status "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" st && cd st
          cp "$out" probe.md && git add probe.md
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -q -m "集計サーバーの調査" || true
          git push -q origin deploy-status
