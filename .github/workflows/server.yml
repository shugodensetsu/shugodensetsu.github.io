# 集計サーバー（server/）を Cloudflare Workers にデプロイする。
# 必要なもの：リポジトリの Secrets に CLOUDFLARE_API_TOKEN（「Cloudflare Workers を編集」テンプレート + D1 編集）。
# STATS_PASSWORD も登録してあれば、集計ページのパスワードとして入れる。
# 結果は deploy-status ブランチの status.md に書く（メールアドレスやアカウントIDは伏せる）。
# このリポジトリは公開なので、wrangler の出力は伏せ字にしてからログに出す。
name: 集計サーバーをデプロイ

on:
  push:
    branches: [main]
    paths: ['server/**', '!server/.check', '!server/.probe', '.github/workflows/server.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: server-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: github.repository == 'shugodensetsu/shugodensetsu.github.io'
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      STATS_PASSWORD: ${{ secrets.STATS_PASSWORD }}
      WRANGLER_SEND_METRICS: 'false'
    defaults:
      run:
        shell: bash
        working-directory: server
    steps:
      - uses: actions/checkout@v4

      - name: 準備
        id: chk
        run: |
          mkdir -p "$RUNNER_TEMP/logs"
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "CLOUDFLARE_API_TOKEN がまだ登録されていません" | tee "$RUNNER_TEMP/logs/0-check.txt"
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "トークンあり" | tee "$RUNNER_TEMP/logs/0-check.txt"
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
          cat > "$RUNNER_TEMP/mask.sh" <<'SH'
          #!/bin/sh
          sed -E -e 's/[0-9a-f]{32}/<id>/g' \
                 -e 's/[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}/<email>/g'
          SH
          chmod +x "$RUNNER_TEMP/mask.sh"

      - uses: actions/setup-node@v4
        if: steps.chk.outputs.ok == 'true'
        with:
          node-version: 22

      - name: wrangler を入れる
        id: install
        if: steps.chk.outputs.ok == 'true'
        run: npm install --no-audit --no-fund 2>&1 | tail -n 5 | tee "$RUNNER_TEMP/logs/1-install.txt"

      - name: データベースを用意
        id: d1
        if: steps.chk.outputs.ok == 'true'
        run: node tools/ensure-d1.mjs 2>&1 | "$RUNNER_TEMP/mask.sh" | tee "$RUNNER_TEMP/logs/2-d1.txt"

      - name: 表を作る（migrations）
        id: migrate
        if: steps.chk.outputs.ok == 'true'
        run: npx wrangler d1 migrations apply DB --remote 2>&1 | "$RUNNER_TEMP/mask.sh" | tee "$RUNNER_TEMP/logs/3-migrate.txt"

      # the password goes in before the code: "secret put" makes a new version from the one that is live at that moment,
      # so doing it after the deploy could bring an older version of the code back
      - name: パスワードを入れる
        id: secret
        if: steps.chk.outputs.ok == 'true' && env.STATS_PASSWORD != ''
        continue-on-error: true
        run: printf '%s' "$STATS_PASSWORD" | npx wrangler secret put STATS_PASSWORD 2>&1 | "$RUNNER_TEMP/mask.sh" | tee "$RUNNER_TEMP/logs/4-secret.txt"

      - name: Worker をデプロイ
        id: deploy
        if: steps.chk.outputs.ok == 'true'
        run: npx wrangler deploy 2>&1 | "$RUNNER_TEMP/mask.sh" | tee "$RUNNER_TEMP/logs/5-deploy.txt"

      - name: パスワードを入れる（はじめてのデプロイのとき）
        id: secret2
        if: steps.chk.outputs.ok == 'true' && env.STATS_PASSWORD != '' && steps.secret.outcome == 'failure'
        run: |
          printf '%s' "$STATS_PASSWORD" | npx wrangler secret put STATS_PASSWORD 2>&1 | "$RUNNER_TEMP/mask.sh" | tee -a "$RUNNER_TEMP/logs/4-secret.txt"
          npx wrangler deploy 2>&1 | "$RUNNER_TEMP/mask.sh" | tee -a "$RUNNER_TEMP/logs/5-deploy.txt"

      - name: 動作確認
        id: check
        if: steps.deploy.outcome == 'success'
        run: |
          log="$RUNNER_TEMP/logs/6-check.txt"
          url=$(grep -ho 'https://[a-z0-9.-]*workers\.dev' "$RUNNER_TEMP/logs/5-deploy.txt" | head -n 1)
          echo "URL: $url" | tee "$log"
          [ -n "$url" ] || { echo "URL が見つからない" | tee -a "$log"; exit 1; }
          code() { curl -s -o /dev/null -w '%{http_code}' --max-time 15 "$@"; }
          checks() {
            try="$RUNNER_TEMP/try.txt"; : > "$try"
            for i in $(seq 1 18); do c=$(code "$url/"); case "$c" in 401|403) break;; esac; sleep 5; done
            ok=1
            want=403; [ -n "$STATS_PASSWORD" ] && want=401
            r=$(code "$url/"); echo "集計ページ（パスワードなし）: $r（$want なら正しい）" >> "$try"; [ "$r" = "$want" ] || ok=0
            r=$(code -X POST -H 'Origin: https://evil.example' -H 'Content-Type: text/plain' --data '{}' "$url/v1/p"); echo "よそのサイトからの報告: $r（403 なら正しい）" >> "$try"; [ "$r" = 403 ] || ok=0
            r=$(code -X POST -H 'Origin: https://shugodensetsu.github.io' -H 'Content-Type: text/plain' --data 'not json' "$url/v1/p"); echo "壊れた報告: $r（400 なら正しい）" >> "$try"; [ "$r" = 400 ] || ok=0
            if [ -n "$STATS_PASSWORD" ]; then
              body=$(curl -s --max-time 15 -u "check:$STATS_PASSWORD" "$url/?d=7")
              if printf '%s' "$body" | grep -q 'の集計'; then echo "集計ページ（パスワードあり）: 表示できた（データベースもOK）" >> "$try"; else echo "集計ページ（パスワードあり）: 表示できない" >> "$try"; printf '%s' "$body" | head -c 300 | "$RUNNER_TEMP/mask.sh" >> "$try"; ok=0; fi
              jar="$RUNNER_TEMP/jar.txt"; rm -f "$jar"
              r=$(curl -s -o /dev/null -w '%{http_code}' --max-time 15 -c "$jar" --data-urlencode "password=$STATS_PASSWORD" "$url/login")
              body=$(curl -s --max-time 15 -b "$jar" "$url/")
              if [ "$r" = 303 ] && printf '%s' "$body" | grep -q 'ログアウト'; then echo "ログイン画面から入る: できた（30日間ログインしたまま）" >> "$try"; else echo "ログイン画面から入る: できない（$r）" >> "$try"; ok=0; fi
              rm -f "$jar"
              r=$(code "$url/manifest.webmanifest"); echo "ホーム画面用の設定: $r（200 なら正しい）" >> "$try"; [ "$r" = 200 ] || ok=0
            fi
            [ "$ok" = 1 ]
          }
          # a new version can take a little while to reach every Cloudflare location: try for up to 2 minutes
          passed=0
          for n in $(seq 1 8); do
            if checks; then passed=1; break; fi
            echo "（$n 回目：まだ古い版かもしれないので待つ）" >> "$log"; sleep 15
          done
          cat "$try" | tee -a "$log"
          if [ "$passed" != 1 ]; then
            echo "--- 調べるための情報 ---" >> "$log"
            curl -s -o /dev/null -D - --max-time 15 "$url/manifest.webmanifest" | head -n 12 | "$RUNNER_TEMP/mask.sh" >> "$log"
            (cd "$GITHUB_WORKSPACE/server" && npx wrangler deployments status 2>&1 | tail -n 12 | "$RUNNER_TEMP/mask.sh") >> "$log"
            (cd "$GITHUB_WORKSPACE/server" && npx wrangler versions list 2>&1 | tail -n 30 | "$RUNNER_TEMP/mask.sh") >> "$log"
          fi
          [ "$passed" = 1 ]

      - name: 結果を deploy-status に書く
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          out="$RUNNER_TEMP/status.md"
          {
            echo "# 集計サーバーのデプロイ結果"
            echo
            echo "- 日時: $(TZ=Asia/Tokyo date '+%Y-%m-%d %H:%M:%S') (JST)"
            echo "- コミット: ${GITHUB_SHA::7}"
            echo "- 準備: ${{ steps.chk.outcome }} / トークン: ${{ steps.chk.outputs.ok }}"
            echo "- wrangler: ${{ steps.install.outcome }}"
            echo "- データベース: ${{ steps.d1.outcome }}"
            echo "- 表: ${{ steps.migrate.outcome }}"
            echo "- デプロイ: ${{ steps.deploy.outcome }}"
            echo "- パスワード: ${{ steps.secret.outcome }} ${{ steps.secret2.outcome }}"
            echo "- 動作確認: ${{ steps.check.outcome }}"
            echo
            echo "## URL"
            grep -ho 'https://[a-z0-9.-]*workers\.dev' "$RUNNER_TEMP"/logs/*.txt 2>/dev/null | sort -u || true
            for f in "$RUNNER_TEMP"/logs/*.txt; do
              [ -f "$f" ] || continue
              echo
              echo "## $(basename "$f" .txt)"
              echo '```'
              tail -n 70 "$f" | "$RUNNER_TEMP/mask.sh"
              echo '```'
            done
          } > "$out"
          cat "$out"
          cd "$RUNNER_TEMP" && rm -rf st && mkdir st && cd st
          git init -q && git checkout -q -b deploy-status
          cp "$out" status.md && git add status.md
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -q -m "集計サーバーのデプロイ結果 ${GITHUB_SHA::7}"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" deploy-status
